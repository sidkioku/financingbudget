<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="50%" stop-color="#0f4c5c"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Full-bleed background (iOS clips the squircle automatically for apple-touch-icon) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Subtle ambient glow -->
  <circle cx="390" cy="120" r="180" fill="#2dd4bf" opacity="0.14"/>
  <circle cx="110" cy="410" r="160" fill="#10b981" opacity="0.12"/>

  <!-- Back Tilted Card -->
  <g transform="translate(256 248) rotate(-10) translate(-256 -248)" filter="url(#shadow)">
    <rect x="96" y="126" width="300" height="190" rx="28" fill="#1e293b" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
    <rect x="96" y="164" width="300" height="36" fill="#0f172a"/>
  </g>

  <!-- Front Wallet / Smart Card -->
  <g filter="url(#shadow)">
    <rect x="86" y="162" width="340" height="224" rx="34" fill="url(#cardGrad)"/>
    <!-- Inner glass highlight -->
    <rect x="92" y="168" width="328" height="212" rx="29" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="3"/>

    <!-- EMV Chip -->
    <rect x="126" y="206" width="58" height="44" rx="10" fill="url(#goldGrad)"/>
    <path d="M126 228 H184 M155 206 V250" stroke="#b45309" stroke-width="2.5" opacity="0.55"/>

    <!-- Upward Trend Bars inside Card -->
    <rect x="128" y="314" width="24" height="34" rx="6" fill="rgba(255,255,255,0.45)"/>
    <rect x="164" y="296" width="24" height="52" rx="6" fill="rgba(255,255,255,0.68)"/>
    <rect x="200" y="274" width="24" height="74" rx="6" fill="#ffffff"/>

    <!-- Wallet Clasp & Euro Coin Badge -->
    <circle cx="334" cy="274" r="62" fill="#0b172a" opacity="0.92"/>
    <circle cx="334" cy="274" r="54" fill="url(#goldGrad)"/>
    <!-- Vector Euro Symbol (€) -->
    <path d="M352 248 C345 241 333 239 323 245 C312 251 307 262 307 274 C307 286 312 297 323 303 C333 309 345 307 352 300"
          fill="none" stroke="#0b172a" stroke-width="11" stroke-linecap="round"/>
    <line x1="297" y1="266" x2="340" y2="266" stroke="#0b172a" stroke-width="9" stroke-linecap="round"/>
    <line x1="297" y1="282" x2="336" y2="282" stroke="#0b172a" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
